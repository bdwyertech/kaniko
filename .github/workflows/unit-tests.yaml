name: Unit tests

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v4.01
      with:
        go-version: '1.22'
    - uses: actions/checkout@85e6279cec87321a52edac9c87bce653a07cf6c2 # v3
    - run: make test
